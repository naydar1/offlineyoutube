<meta name='viewport' content='width=device-width, initial-scale=1'/>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>Offline Video</title>

<style>
:root {
  --bg: #0f0f0f;
  --panel: #1c1c1e;
  --panel2: #29292d;
  --text: #f5f5f5;
  --muted: #aaa;
  --red: #ff3333;
  --border: #303033;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}

button, input { font: inherit; }

button {
  border: 0;
  cursor: pointer;
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--text);
  background: var(--panel2);
}

button:active { opacity: .75; }

header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: #111111f2;
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 15px 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 800;
  font-size: 20px;
}

.brand-icon {
  display: grid;
  place-items: center;
  width: 34px;
  height: 25px;
  border-radius: 8px;
  background: var(--red);
  color: white;
  font-size: 15px;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
}

main {
  max-width: 1500px;
  margin: 0 auto;
  padding: 16px;
}

.toolbar {
  display: flex;
  gap: 9px;
  margin-bottom: 14px;
}

#search {
  flex: 1;
  width: 100%;
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  color: white;
}

#sortBtn { white-space: nowrap; }

.library-info {
  color: var(--muted);
  font-size: 13px;
  margin: 14px 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.video-card {
  background: var(--panel);
  border-radius: 12px;
  overflow: hidden;
  min-width: 0;
}

.card-play {
  display: block;
  width: 100%;
  padding: 0;
  border-radius: 0;
  background: #252529;
  text-align: center;
}

.thumb {
  aspect-ratio: 16 / 9;
  display: grid;
  place-items: center;
  font-size: 32px;
  color: #ddd;
  background: linear-gradient(135deg, #28282d, #111);
}

.card-content { padding: 10px; }

.card-title {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-meta {
  color: var(--muted);
  font-size: 11px;
  margin-top: 7px;
}

.card-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 9px;
}

.delete-btn {
  color: #ff8b8b;
  background: #382020;
  font-size: 12px;
  padding: 7px 10px;
}

.empty {
  color: var(--muted);
  text-align: center;
  padding: 55px 20px;
  line-height: 1.6;
  grid-column: 1 / -1;
}

.note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  margin-top: 24px;
}

/* Bottom navigation */

.bottom-nav {
  position: fixed;
  z-index: 8;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: #171719f5;
  border-top: 1px solid var(--border);
  backdrop-filter: blur(14px);
}

.nav-btn {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  max-width: 220px;
  padding: 7px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
}

.nav-btn .icon { font-size: 21px; }

.nav-btn.active {
  color: white;
  background: #29292d;
}

/* Video player */

#player {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  overflow-y: auto;
  background: var(--bg);
  padding: 12px 14px calc(20px + env(safe-area-inset-bottom));
}

.player-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 1500px;
  margin: 0 auto 14px;
}

#closePlayer { flex-shrink: 0; }

#playerTitle {
  font-size: 14px;
  font-weight: 700;
  overflow-wrap: anywhere;
  min-width: 0;
}

.player-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 22px;
  max-width: 1500px;
  margin: 0 auto;
}

.player-main { min-width: 0; }

#mainVideo {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: 70vh;
  background: black;
  border-radius: 10px;
}

.now-playing-title {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
  margin-top: 13px;
}

.suggestion-heading {
  font-size: 16px;
  font-weight: 800;
  margin: 0 0 12px;
}

.suggestion-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.suggestion {
  display: grid;
  grid-template-columns: 42% minmax(0, 1fr);
  gap: 10px;
  width: 100%;
  padding: 0;
  background: transparent;
  text-align: left;
  align-items: start;
}

.suggestion-thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  background: linear-gradient(135deg, #303036, #151518);
  border-radius: 9px;
  overflow: hidden;
  display: grid;
  place-items: center;
  color: #ddd;
  font-size: 23px;
}

.suggestion-info {
  min-width: 0;
  padding: 2px 0;
}

.suggestion-title {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.suggestion-meta {
  color: var(--muted);
  font-size: 11px;
  margin-top: 7px;
  line-height: 1.4;
}

.no-suggestions {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  padding: 15px;
  background: var(--panel);
  border-radius: 10px;
}

@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

  #player { padding: 20px 25px; }

  .player-layout {
    grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
    align-items: start;
  }

  #mainVideo { max-height: calc(100vh - 150px); }

  .suggestion { grid-template-columns: 145px minmax(0, 1fr); }
}

@media (max-width: 360px) {
  main { padding: 11px; }
  .grid { gap: 9px; }
  .toolbar { gap: 6px; }
  #sortBtn { font-size: 12px; padding: 10px; }
  .card-content { padding: 8px; }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <span class="brand-icon">▶</span>
    <span>Offline Video</span>
  </div>
  <div class="subtitle">Your personal video library</div>
</header>

<main id="homePage">
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search your videos...">
    <button id="sortBtn">Recently added ↓</button>
  </div>

  <div class="library-info" id="libraryInfo">Loading your library...</div>
  <div class="grid" id="videoGrid"></div>

  <div class="note">
    Videos are saved locally in this browser using device storage.
    No account required. Imported video files stay on this device.
    Keep the original files if you need another copy.
  </div>
</main>

<!-- Hidden file input opened by the bottom Import button -->
<input
  id="picker"
  type="file"
  accept="video/*,.mp4,.mov,.m4v,.webm,.mkv,.avi"
  multiple
  hidden
>

<!-- Video player and suggestions -->
<div id="player">
  <div class="player-bar">
    <button id="closePlayer">← Home</button>
    <span id="playerTitle"></span>
  </div>

  <div class="player-layout">
    <section class="player-main">
      <video id="mainVideo" controls playsinline preload="metadata"></video>
      <div class="now-playing-title" id="nowPlayingTitle"></div>
    </section>

    <aside id="suggestions">
      <div class="suggestion-heading">Up next</div>
      <div id="suggestionList" class="suggestion-list"></div>
    </aside>
  </div>
</div>

<nav class="bottom-nav">
  <button id="homeNav" class="nav-btn active">
    <span class="icon">⌂</span>
    <span>Home</span>
  </button>
  <button id="importNav" class="nav-btn">
    <span class="icon">＋</span>
    <span>Import</span>
  </button>
</nav>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const DB_NAME = "offline-video-library-v1";
  const DB_VERSION = 1;
  const STORE_NAME = "videos";

  let db = null;
  let items = [];
  let currentUrl = null;
  let sortNewest = true;
  let activeVideoId = null;

  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = () => {
        const database = request.result;

        if (!database.objectStoreNames.contains(STORE_NAME)) {
          const store = database.createObjectStore(STORE_NAME, {
            keyPath: "id",
            autoIncrement: true
          });

          store.createIndex("added", "added", { unique: false });
          store.createIndex("name", "name", { unique: false });
        }
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function getAllVideos() {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, "readonly");
      const request = transaction.objectStore(STORE_NAME).getAll();

      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  function addVideo(video) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, "readwrite");
      const request = transaction.objectStore(STORE_NAME).add(video);

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function deleteVideo(id) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, "readwrite");
      const request = transaction.objectStore(STORE_NAME).delete(id);

      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  function formatSize(bytes) {
    if (!Number.isFinite(bytes)) return "";

    const units = ["B", "KB", "MB", "GB", "TB"];
    let size = bytes;
    let unit = 0;

    while (size >= 1024 && unit < units.length - 1) {
      size /= 1024;
      unit++;
    }

    return `${size.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
  }

  function formatDate(timestamp) {
    try {
      return new Date(timestamp).toLocaleDateString();
    } catch {
      return "";
    }
  }

  function safeText(element, value) {
    element.textContent = value == null ? "" : String(value);
  }

  async function loadLibrary() {
    try {
      items = await getAllVideos();
      renderLibrary();
    } catch (error) {
      console.error(error);
      $("libraryInfo").textContent =
        "Could not load your library. Your browser may be out of storage space.";
    }
  }

  function renderLibrary() {
    const query = $("search").value.trim().toLowerCase();
    const grid = $("videoGrid");

    grid.innerHTML = "";

    let filtered = items.filter(video =>
      String(video.name || "").toLowerCase().includes(query)
    );

    filtered.sort((a, b) => {
      if (sortNewest) {
        return (b.added || 0) - (a.added || 0);
      }

      return String(a.name || "").localeCompare(String(b.name || ""));
    });

    $("libraryInfo").textContent =
      `${items.length} video${items.length === 1 ? "" : "s"} in your library`;

    if (filtered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";

      if (items.length === 0) {
        empty.innerHTML =
          "Your library is empty.<br>Tap <strong>＋ Import</strong> below to add videos from your device.";
      } else {
        empty.textContent = "No videos match your search.";
      }

      grid.appendChild(empty);
      return;
    }

    for (const video of filtered) {
      const card = document.createElement("article");
      card.className = "video-card";

      const playButton = document.createElement("button");
      playButton.className = "card-play";
      playButton.setAttribute("aria-label", `Play ${video.name}`);

      const thumbnail = document.createElement("div");
      thumbnail.className = "thumb";
      thumbnail.textContent = "▶";

      playButton.appendChild(thumbnail);
      playButton.addEventListener("click", () => openVideo(video));

      const content = document.createElement("div");
      content.className = "card-content";

      const title = document.createElement("div");
      title.className = "card-title";
      safeText(title, video.name);

      const meta = document.createElement("div");
      meta.className = "card-meta";
      safeText(meta, `${formatSize(video.size)} · ${formatDate(video.added)}`);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-btn";
      deleteButton.textContent = "Delete";

      deleteButton.addEventListener("click", async () => {
        const confirmed = confirm(`Delete "${video.name}" from your library?`);
        if (!confirmed) return;

        try {
          if (activeVideoId === video.id) closePlayer();

          await deleteVideo(video.id);
          await loadLibrary();
        } catch (error) {
          console.error(error);
          alert("Could not delete this video.");
        }
      });

      actions.appendChild(deleteButton);
      content.append(title, meta, actions);
      card.append(playButton, content);
      grid.appendChild(card);
    }
  }

  function renderSuggestions(activeId) {
    const list = $("suggestionList");
    list.innerHTML = "";

    const suggestions = items
      .filter(video => video.id !== activeId)
      .sort((a, b) => (b.added || 0) - (a.added || 0));

    if (suggestions.length === 0) {
      const empty = document.createElement("div");
      empty.className = "no-suggestions";
      empty.textContent =
        "Import more videos and they will appear here as suggestions.";
      list.appendChild(empty);
      return;
    }

    for (const video of suggestions) {
      const button = document.createElement("button");
      button.className = "suggestion";
      button.setAttribute("aria-label", `Play ${video.name}`);

      const thumbnail = document.createElement("span");
      thumbnail.className = "suggestion-thumb";
      thumbnail.textContent = "▶";

      const info = document.createElement("span");
      info.className = "suggestion-info";

      const title = document.createElement("span");
      title.className = "suggestion-title";
      safeText(title, video.name);

      const meta = document.createElement("div");
      meta.className = "suggestion-meta";
      safeText(meta, `${formatSize(video.size)} · ${formatDate(video.added)}`);

      info.append(title, meta);
      button.append(thumbnail, info);

      button.addEventListener("click", () => openVideo(video));

      list.appendChild(button);
    }
  }

  function openVideo(video) {
    if (!video || !video.blob) {
      alert("This video file is no longer available in your library.");
      return;
    }

    if (currentUrl) {
      URL.revokeObjectURL(currentUrl);
      currentUrl = null;
    }

    currentUrl = URL.createObjectURL(video.blob);
    activeVideoId = video.id;

    $("mainVideo").src = currentUrl;
    $("playerTitle").textContent = video.name;
    $("nowPlayingTitle").textContent = video.name;
    $("player").style.display = "block";

    renderSuggestions(video.id);

    $("mainVideo").play().catch(() => {
      // The user can press Play if the browser blocks automatic playback.
    });
  }

  function closePlayer() {
    $("mainVideo").pause();
    $("mainVideo").removeAttribute("src");
    $("mainVideo").load();
    $("player").style.display = "none";

    if (currentUrl) {
      URL.revokeObjectURL(currentUrl);
      currentUrl = null;
    }

    activeVideoId = null;
  }

  async function importFiles(event) {
    const files = Array.from(event.target.files || []);
    event.target.value = "";

    if (files.length === 0) return;

    $("homeNav").classList.add("active");
    $("importNav").classList.remove("active");

    let imported = 0;
    let failed = 0;

    for (const file of files) {
      const isVideo =
        file.type.startsWith("video/") ||
        /\.(mp4|mov|m4v|webm|mkv|avi|ogv|3gp)$/i.test(file.name);

      if (!isVideo) continue;

      try {
        await addVideo({
          name: file.name,
          size: file.size,
          type: file.type || "video/mp4",
          blob: file,
          added: Date.now()
        });

        imported++;
      } catch (error) {
        console.error(error);
        failed++;
      }
    }

    await loadLibrary();

    if (failed > 0) {
      alert(
        `${imported} video(s) imported. ${failed} could not be saved. Your device or browser may be out of storage space.`
      );
    } else if (imported === 0) {
      alert("No supported video files were selected.");
    }
  }

  $("picker").addEventListener("change", importFiles);

  $("importNav").addEventListener("click", () => {
    $("importNav").classList.add("active");
    $("homeNav").classList.remove("active");
    $("picker").click();
  });

  $("homeNav").addEventListener("click", () => {
    closePlayer();
    $("homeNav").classList.add("active");
    $("importNav").classList.remove("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("closePlayer").addEventListener("click", () => {
    closePlayer();
    $("homeNav").classList.add("active");
    $("importNav").classList.remove("active");
  });

  $("search").addEventListener("input", renderLibrary);

  $("sortBtn").addEventListener("click", () => {
    sortNewest = !sortNewest;
    $("sortBtn").textContent = sortNewest
      ? "Recently added ↓"
      : "Title A–Z";

    renderLibrary();
  });

  async function startApp() {
    if (!("indexedDB" in window)) {
      $("libraryInfo").textContent =
        "This browser does not support local video storage.";
      return;
    }

    try {
      db = await openDatabase();
      await loadLibrary();
    } catch (error) {
      console.error(error);
      $("libraryInfo").textContent =
        "Could not open video storage. Try opening this page in Safari or another supported browser.";
    }
  }

  window.addEventListener("pagehide", () => {
    if (currentUrl) {
      URL.revokeObjectURL(currentUrl);
      currentUrl = null;
    }
  });

  startApp();
})();
</script>

</body>
</html>
